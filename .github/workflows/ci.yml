name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Streamlit help contains Unicode; Windows redirected output needs UTF-8.
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Validate committed demo bundle
        run: python -m deuce.cli demo validate

      - name: Smoke-test structured CLI
        run: |
          python -m deuce.cli feature-tiers
          python -m deuce.cli --help
